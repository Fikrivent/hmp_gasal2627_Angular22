<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>pastadetail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">pastadetail</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-list>
    <ion-card>
      <img alt="{{ pastas.name }}" src="{{ pastas.url }}" />
      <ion-card-header>
        <ion-card-title>{{ pastas.name }}</ion-card-title>
        <ion-card-subtitle>Rp.{{ pastas.price | number }}</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        {{ pastas.description }}
        <br><br>
        <ion-label>Pasta Recipe Instruction:</ion-label>
        <ol>
          <li *ngFor="let ins of pastas.instructions">
            {{ ins.instruction }}
          </li>
        </ol>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
